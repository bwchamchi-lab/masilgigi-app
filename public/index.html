<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>마실지기 - 안전한 걸음의 시작</title>
    <meta name="description" content="낙상 감지와 마실(걷기) 리포트로 어르신의 안전한 걸음을 지키는 마실지기" />

    <!-- 테마 컬러 (브랜드 청록) -->
    <meta name="theme-color" content="#0B3D38" />
    <meta name="background-color" content="#0B3D38" />

    <!-- PWA 매니페스트 -->
    <link rel="manifest" href="manifest.json" />

    <!-- iOS Safari: 홈 화면에 추가했을 때 독립 앱처럼 실행되도록 하는 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="마실지기" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- 안드로이드 Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" href="favicon.ico" />

    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: #0b3d38;
        overscroll-behavior: none;
      }
      /* iOS 상단 노치 영역까지 배경색이 이어지도록 */
      @supports (padding: max(0px)) {
        body {
          padding-top: env(safe-area-inset-top);
        }
      }
    </style>
  </head>
  <body>
    <!-- Metro가 빌드 시 이 아래에 번들 <script> 태그를 자동으로 주입합니다 -->
    <div id="root"></div>
    <noscript>이 앱을 실행하려면 자바스크립트가 필요합니다.</noscript>
  </body>
</html>
