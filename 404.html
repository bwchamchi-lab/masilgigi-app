<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>마실지기 - 안전한 걸음의 시작</title>
    <meta name="description" content="낙상 감지와 마실(걷기) 리포트로 어르신의 안전한 걸음을 지키는 마실지기" />

    <!-- 테마 컬러 (브랜드 청록) -->
    <meta name="theme-color" content="#0B3D38" />
    <meta name="background-color" content="#0B3D38" />

    <!-- PWA 매니페스트 -->
    <link rel="manifest" href="manifest.json" />

    <!-- iOS Safari: 홈 화면에 추가했을 때 독립 앱처럼 실행되도록 하는 메타 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="마실지기" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- 안드로이드 Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" href="favicon.ico" />

    <style>
      html,
      body,
      #root {
        height: 100%;
        /* --app-height는 아래 스크립트가 window.innerHeight(실제 보이는 화면 높이)로 채웁니다.
           iOS PWA 독립 실행 모드에서 100%/100vh만으로는 주소창 유무에 따라 계산이 살짝 어긋나
           화면 맨 아래에 배경색 띠가 남는 경우가 있어, JS로 정확한 값을 강제로 맞춰줍니다. */
        height: var(--app-height, 100%);
        width: 100%;
      }
      body {
        margin: 0;
        background-color: #0b3d38;
        overscroll-behavior: none;
      }
      /* React Native Web이 #root 안에 넣는 실제 앱 래퍼가 화면 전체 높이를 꽉 채우도록 강제.
         이게 없으면 내용이 화면 위쪽에 쪼그라들고, 나머지 영역은 배경색만 있는 빈 공간으로 남는 문제가 생깁니다. */
      #root {
        display: flex;
      }
      #root > div {
        flex: 1;
        display: flex;
        min-height: 100%;
        min-height: var(--app-height, 100%);
      }
    </style>
    <script>
      (function () {
        function setAppHeight() {
          document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
      })();
    </script>
  <meta name="theme-color" content="#0B3D38">
</head>
  <body>
    <!-- Metro가 빌드 시 이 아래에 번들 <script> 태그를 자동으로 주입합니다 -->
    <div id="root"></div>
    <noscript>이 앱을 실행하려면 자바스크립트가 필요합니다.</noscript>
  <script src="/masilgigi-app/_expo/static/js/web/AppEntry-d9ed4c90dce13b76db140bbccb577cfa.js" defer></script>
</body>
</html>
